name: Déploiement Holisya (sur tag)

# Se déclenche à chaque push d'un tag de version (ex: v1.2.0)
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: holisya-deploy
  cancel-in-progress: false

env:
  VPS_HOST: 93.93.117.124
  VPS_USER: warren

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code (au tag)
        uses: actions/checkout@v4

      - name: Préparer la clé SSH du VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Synchroniser le code vers le VPS
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' \
            --exclude 'node_modules' --exclude '.next' --exclude 'tsconfig.tsbuildinfo' \
            --exclude '.env' --exclude 'public/uploads' --exclude 'private-media' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            ./ "$VPS_USER@$VPS_HOST:~/holisya/"

      - name: Installer, migrer, builder et redémarrer
        run: |
          TAG="${GITHUB_REF_NAME}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            "cd ~/holisya \
             && npm install --no-audit --no-fund --legacy-peer-deps \
             && npx prisma generate \
             && npx prisma db push --accept-data-loss \
             && ( grep -q '^APP_VERSION=' .env && sed -i \"s|^APP_VERSION=.*|APP_VERSION=${TAG}|\" .env || echo \"APP_VERSION=${TAG}\" >> .env ) \
             && npm run build \
             && pm2 restart holisya --update-env"

      - name: Vérifier le site
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            "sleep 2 && curl -s -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:3003/"
